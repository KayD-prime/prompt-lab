name: prompt tests

on:
  push:
  pull_request:

jobs:
  practice:
    name: every case, on the practice server (free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          PROMPTLAB_PRACTICE: "1"

  real-model:
    name: every case, on the real model (needs the GROQ_API_KEY secret)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_REAL_MODEL == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL: openai/gpt-oss-20b
